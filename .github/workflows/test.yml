name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install dependencies
        run: |
          # Install the dev extra straight from pyproject, exactly as the
          # devcontainer's postCreate does, so drift in pyproject's dev deps
          # fails CI instead of breaking container builds later. pyproject is
          # the single source of truth for dev dependencies and the pytest-homeassistant pin.
          uv pip install -e '.[dev]' --system --config-settings editable_mode=compat
      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=custom_components/abb_powerone_pvi_sunspec \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=junit.xml \
            -o junit_family=legacy \
            -v
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: coverage
          verbose: true

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          verbose: true
