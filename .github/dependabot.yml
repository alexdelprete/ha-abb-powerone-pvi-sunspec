version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "homeassistant"
      # ruff, ty and pymarkdownlnt are pinned fleet-wide by TOOL_VERSIONS in the
      # template repo (CI, pre-commit hooks, and the shared pyproject block are all
      # rendered from it); a Dependabot bump here would fight the sync. Bump the
      # table instead. pymarkdownlnt is held back on purpose (newer releases add
      # rules that turn the fleet's Lint red).
      - dependency-name: "ruff"
      - dependency-name: "ty"
      - dependency-name: "pymarkdownlnt"
      # pytest-homeassistant (and through it the HA release the tests run on) is
      # bumped by Dependabot in the template repo only; the bump reaches this repo
      # as a synced PR.
      - dependency-name: "pytest-homeassistant"
