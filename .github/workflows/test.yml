name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          # Install the dev extra straight from pyproject, exactly as the
          # devcontainer's postCreate does, so drift in pyproject's dev deps
          # fails CI instead of breaking container builds later. pyproject is
          # the single source of truth for dev dependencies and the phacc pin.
          uv pip install -e '.[dev]' --system --config-settings editable_mode=compat
      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=custom_components/abb_powerone_pvi_sunspec \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=junit.xml \
            -o junit_family=legacy \
            -v
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: coverage
          verbose: true

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          verbose: true
