name: "Release"

on:
  release:
    types:
      - "published"

permissions: {}

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-26.04"
    permissions:
      contents: write
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - name: "Validate version numbers"
        shell: "bash"
        env:
          # Through the environment, not ${{ }} in the script: a tag name is
          # user-controlled text and must never be expanded into shell code.
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          # Extract version from tag (remove 'v' prefix if present)
          TAG_VERSION="$TAG_NAME"
          TAG_VERSION="${TAG_VERSION#v}"

          # Extract version from manifest.json
          MANIFEST_VERSION=$(yq -r '.version' \
            "${{ github.workspace }}/custom_components/abb_powerone_pvi_sunspec/manifest.json")

          # Extract VERSION from const.py
          CONST_VERSION=$(grep -E "^VERSION = " \
            "${{ github.workspace }}/custom_components/abb_powerone_pvi_sunspec/const.py" \
            | sed 's/VERSION = "\(.*\)"/\1/')

          # Fail early if extraction produced nothing (drifted declaration style)
          if [[ -z "$CONST_VERSION" ]]; then
            echo "::error::Could not extract VERSION from const.py"
            echo ""
            echo "ERROR: could not extract VERSION from const.py."
            echo "const.py must declare the version as exactly:"
            echo "  VERSION = \"X.Y.Z\""
            echo "(plain assignment — no Final annotation; repo-sync enforces this form)."
            exit 1
          fi

          echo "Tag version:      $TAG_VERSION"
          echo "manifest.json:    $MANIFEST_VERSION"
          echo "const.py:         $CONST_VERSION"

          # Validate all versions match
          if [[ "$TAG_VERSION" != "$MANIFEST_VERSION" ]] || [[ "$TAG_VERSION" != "$CONST_VERSION" ]]; then
            echo ""
            echo "::error::Version mismatch detected!"
            echo ""
            echo "ERROR: Version mismatch!"
            echo "  Tag:           $TAG_VERSION"
            echo "  manifest.json: $MANIFEST_VERSION"
            echo "  const.py:      $CONST_VERSION"
            echo ""
            echo "Please update versions in manifest.json and const.py before releasing."
            echo "See CLAUDE.md for the release process."
            exit 1
          fi

          echo ""
          echo "✓ All versions match: $TAG_VERSION"

      - name: "ZIP the integration directory"
        shell: "bash"
        run: |
          cd "${{ github.workspace }}/custom_components/abb_powerone_pvi_sunspec"
          zip abb_powerone_pvi_sunspec.zip -r ./

      - name: "Upload the ZIP file to the release"
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: ${{ github.workspace }}/custom_components/abb_powerone_pvi_sunspec/abb_powerone_pvi_sunspec.zip
