version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The workflows synced from the template repo pin these actions to commit SHAs,
      # kept current there by follow-ha.yml; a Dependabot bump here would fight the
      # sync. Workflows this repo owns still get updates for every other action.
      # follow-ha.py --check fails if a synced workflow uses an action missing here.
      - dependency-name: "actions/checkout"
      - dependency-name: "actions/setup-python"
      - dependency-name: "astral-sh/setup-uv"
      - dependency-name: "codecov/codecov-action"
      - dependency-name: "dependabot/fetch-metadata"
      - dependency-name: "hacs/action"
      - dependency-name: "home-assistant/actions"
      - dependency-name: "softprops/action-gh-release"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "homeassistant"
      # ruff, ty and pymarkdownlnt are pinned fleet-wide by TOOL_VERSIONS in the
      # template repo (CI, pre-commit hooks, and the shared pyproject block are all
      # rendered from it); a Dependabot bump here would fight the sync. Bump the
      # table instead. pymarkdownlnt is held back on purpose (newer releases add
      # rules that turn the fleet's Lint red).
      - dependency-name: "ruff"
      - dependency-name: "ty"
      - dependency-name: "pymarkdownlnt"
      # pytest-homeassistant (and through it the HA release the tests run on) is
      # followed by follow-ha.yml in the template repo; the bump reaches this repo
      # as a synced PR.
      - dependency-name: "pytest-homeassistant"
      # Exact (==) pins in dev_extra_requirements follow Home Assistant's own pin of the
      # package (the tests run against what Home Assistant ships). The template's daily
      # follow-ha conflicts check reports one that differs; a bump here would only be
      # reverted by the next sync. Ranges (>=, ~=) stay with Dependabot.
      - dependency-name: "modbus-connection"
